name: FieldView CI

on:
  push:
    branches:
      - fieldview-architecture-migration
  pull_request:
    branches:
      - main

# Keep only the newest pending/running CI run per branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Workspace validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm version
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      # Exercise the committed D1 migration against a fresh local database.
      # This is intentionally local-only; it must never touch Production or Preview databases.
      - name: Apply and verify local D1 schema
        run: |
          npx --yes wrangler@^4.135.0 d1 migrations apply fieldview-d1-prod --local --config workers/fieldview/wrangler.toml
          schema="$(npx --yes wrangler@^4.135.0 d1 execute fieldview-d1-prod --local --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('discovery_records', 'system_records') ORDER BY name;" --json --config workers/fieldview/wrangler.toml)"
          printf '%s\\n' "$schema"
          node -e 'const value = JSON.parse(process.argv[1]); const batches = Array.isArray(value) ? value : [value]; const rows = batches.flatMap((batch) => batch.results ?? batch.result?.results ?? []); const names = rows.map((row) => row.name).sort(); const expected = ["discovery_records", "system_records"]; if (JSON.stringify(names) !== JSON.stringify(expected)) throw new Error("Unexpected D1 schema tables: " + JSON.stringify(names));' "$schema"

      - name: Generate Next.js types
        run: npx next typegen
        working-directory: apps/web

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Run workspace tests
        run: npm test

      # The existing application has a documented legacy lint baseline.
      # Keep lint visible in CI without making this migration slice fail on
      # unrelated pre-existing findings.
      - name: Lint (non-blocking legacy baseline)
        run: npm run lint
        continue-on-error: true
