name = "fieldview-jobs-prototype"
main = "src/index.ts"
compatibility_date = "2026-11-22"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

# This bucket is shared only with fieldview-runtime-prototype.
[[r2_buckets]]
binding = "DISCOVERY_BUCKET"
bucket_name = "fieldview-discovery-prototype"

[[services]]
binding = "FIELDVIEW_RUNTIME"
service = "fieldview-runtime-prototype"

[[workflows]]
name = "daily-event-readiness-prototype"
binding = "DAILY_EVENT_READINESS"
class_name = "DailyEventReadinessWorkflow"
schedules = ["0 16 * * *"]
concurrency = { limit = 1 }


[[workflows]]
name = "coverage-audit-prototype"
binding = "COVERAGE_AUDIT"
class_name = "CoverageAuditWorkflow"
concurrency = { limit = 1 }

# Configure TBA_API_KEY and RUNTIME_ADMIN_TOKEN as Worker secrets:
# wrangler secret put TBA_API_KEY --config wrangler.prototype.toml
# wrangler secret put RUNTIME_ADMIN_TOKEN --config wrangler.prototype.toml
