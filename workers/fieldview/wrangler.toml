# One environment-neutral Runtime Worker for FieldView and future FIRST products.
name = "runtime"
main = "src/index.ts"
compatibility_date = "2026-11-22"

# Production Worker URL: runtime.frc-fieldview.workers.dev
workers_dev = true

# Enable branch Preview URLs on the same Worker.
preview_urls = true

[triggers]
crons = ["*/5 * * * *", "2 4 * * *", "0 16 * * 1"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[vars]
TBA_AUTHORITATIVE_REFETCH_DELAY_MS = "65000"
STATBOTICS_API_BASE_URL = "https://api-statbotics.iterativerefinement.com/"
STATBOTICS_REFRESH_DELAY_MS = "300000"
EVENT_ACTIVE_INTERVAL_MS = "300000"
EVENT_COMPLETED_RETENTION_MS = "86400000"
TEAM_REFRESH_INTERVAL_MS = "86400000"
TEAM_ACTIVE_REFRESH_INTERVAL_MS = "60000"

# Shared physical D1 database for the logically separate Discovery and System Records schemas.
# Keep domain ownership and repository interfaces separate in application code.
[[d1_databases]]
binding = "FIELDVIEW_DB"
database_name = "fieldview-prod"
database_id = "df5168d5-5efa-4927-b732-c0ee66da5934"

# Production KV namespace for lightweight, non-authoritative read projections.
# Previews must use a separate namespace; never share production KV with branch Previews.
[[kv_namespaces]]
binding = "KV_BINDING"
id = "c067dfcaa3a345b0b43f035a992b4b30"

[[durable_objects.bindings]]
name = "EVENT_RUNTIME"
class_name = "EventRuntime"

[[durable_objects.bindings]]
name = "TEAM_RUNTIME"
class_name = "TeamRuntime"

[[durable_objects.bindings]]
name = "MULTIPLEXER"
class_name = "Multiplexer"

[[durable_objects.bindings]]
name = "DISCOVERY_STORE"
class_name = "DiscoveryStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EventRuntime", "TeamRuntime", "Multiplexer", "DiscoveryStore"]

[[workflows]]
name = "daily-event-readiness"
binding = "DAILY_EVENT_READINESS"
class_name = "DailyEventReadinessWorkflow"
concurrency = { limit = 1 }

[[workflows]]
name = "daily-team-readiness"
binding = "DAILY_TEAM_READINESS"
class_name = "DailyTeamReadinessWorkflow"
concurrency = { limit = 1 }

[[workflows]]
name = "coverage-audit"
binding = "COVERAGE_AUDIT"
class_name = "CoverageAuditWorkflow"
concurrency = { limit = 1 }

[[workflows]]
name = "weekly-event-projection"
binding = "WEEKLY_EVENT_PROJECTION"
class_name = "WeeklyEventProjectionWorkflow"
concurrency = { limit = 1 }

[[workflows]]
name = "polling-coordinator"
binding = "POLLING_COORDINATOR"
class_name = "PollingCoordinatorWorkflow"
concurrency = { limit = 1 }

# Production-only Workflow binding. Intentionally omitted from [previews.workflows.bindings]:
# Cloudflare Previews cannot provision isolated Workflow instances and must not call production Workflows.
[[workflows]]
name = "event-analytics"
binding = "EVENT_ANALYTICS_WORKFLOW"
class_name = "EventAnalyticsWorkflow"
concurrency = { limit = 8 }

[[workflows]]
name = "runtime-admin"
binding = "RUNTIME_ADMIN"
class_name = "RuntimeAdminWorkflow"
concurrency = { limit = 3 }

# Preview settings are explicit: they do not inherit production variables.
# Durable Object namespaces/storage are provisioned independently for each Preview.
# Preview D1 is isolated from production canonical and operational records.
[[previews.d1_databases]]
binding = "FIELDVIEW_DB"
database_name = "fieldview-test"
database_id = "7e7c5be6-4967-44e6-adba-86fe7b1a76cf"

# Intentionally shared with production: KV contains lightweight projections of
# the same authoritative external TBA state, not canonical records or execution history.
# Preview code must not write environment-specific or test-only values into this namespace.
[[previews.kv_namespaces]]
binding = "KV_BINDING"
id = "c067dfcaa3a345b0b43f035a992b4b30"

[previews.vars]
TBA_AUTHORITATIVE_REFETCH_DELAY_MS = "65000"
STATBOTICS_API_BASE_URL = "https://api-statbotics.iterativerefinement.com/"
STATBOTICS_REFRESH_DELAY_MS = "300000"
EVENT_ACTIVE_INTERVAL_MS = "300000"
EVENT_COMPLETED_RETENTION_MS = "86400000"
TEAM_REFRESH_INTERVAL_MS = "86400000"
TEAM_ACTIVE_REFRESH_INTERVAL_MS = "60000"

[[previews.durable_objects.bindings]]
name = "EVENT_RUNTIME"
class_name = "EventRuntime"

[[previews.durable_objects.bindings]]
name = "TEAM_RUNTIME"
class_name = "TeamRuntime"

[[previews.durable_objects.bindings]]
name = "MULTIPLEXER"
class_name = "Multiplexer"

[[previews.durable_objects.bindings]]
name = "DISCOVERY_STORE"
class_name = "DiscoveryStore"

