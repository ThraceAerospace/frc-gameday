# Shared Runtime Worker configuration for FieldView and future FIRST products.
name = "runtime"
# Deploy explicitly with --env preprod or --env production.
# Each environment owns a fresh, independent Durable Object namespace.

main = "src/index.ts"
compatibility_date = "2026-11-22"

[observability]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

# Preproduction
[env.preprod]
name = "runtime-preprod"
workers_dev = true
preview_urls = false

[env.preprod.vars]
TBA_AUTHORITATIVE_REFETCH_DELAY_MS = "65000"
STATBOTICS_API_BASE_URL = "https://api-statbotics.iterativerefinement.com/"
STATBOTICS_REFRESH_DELAY_MS = "300000"
EVENT_UPCOMING_INTERVAL_MS = "1800000"
EVENT_ACTIVE_INTERVAL_MS = "300000"
EVENT_COMPLETED_RETENTION_MS = "86400000"
TEAM_REFRESH_INTERVAL_MS = "86400000"
TEAM_ACTIVE_REFRESH_INTERVAL_MS = "60000"

[[env.preprod.durable_objects.bindings]]
name = "EVENT_RUNTIME"
class_name = "EventRuntime"

[[env.preprod.durable_objects.bindings]]
name = "TEAM_RUNTIME"
class_name = "TeamRuntime"

[[env.preprod.durable_objects.bindings]]
name = "MULTIPLEXER"
class_name = "Multiplexer"

[[env.preprod.durable_objects.bindings]]
name = "DISCOVERY_STORE"
class_name = "DiscoveryStore"

[[env.preprod.migrations]]
tag = "v1"
new_sqlite_classes = ["EventRuntime", "TeamRuntime", "Multiplexer", "DiscoveryStore"]

[[env.preprod.workflows]]
name = "preprod-daily-event-readiness"
binding = "DAILY_EVENT_READINESS"
class_name = "DailyEventReadinessWorkflow"
concurrency = { limit = 1 }

[[env.preprod.workflows]]
name = "preprod-daily-team-readiness"
binding = "DAILY_TEAM_READINESS"
class_name = "DailyTeamReadinessWorkflow"
concurrency = { limit = 1 }

[[env.preprod.workflows]]
name = "preprod-coverage-audit"
binding = "COVERAGE_AUDIT"
class_name = "CoverageAuditWorkflow"
concurrency = { limit = 1 }

[[env.preprod.workflows]]
name = "preprod-runtime-admin"
binding = "RUNTIME_ADMIN"
class_name = "RuntimeAdminWorkflow"
concurrency = { limit = 3 }

# Production. Do not deploy until preproduction validation and the production
# system-administrator authorization design are complete.
[env.production]
name = "runtime-production"
workers_dev = false
preview_urls = false

[env.production.vars]
TBA_AUTHORITATIVE_REFETCH_DELAY_MS = "65000"
STATBOTICS_API_BASE_URL = "https://api-statbotics.iterativerefinement.com/"
STATBOTICS_REFRESH_DELAY_MS = "300000"
EVENT_UPCOMING_INTERVAL_MS = "1800000"
EVENT_ACTIVE_INTERVAL_MS = "300000"
EVENT_COMPLETED_RETENTION_MS = "86400000"
TEAM_REFRESH_INTERVAL_MS = "86400000"
TEAM_ACTIVE_REFRESH_INTERVAL_MS = "60000"

[[env.production.durable_objects.bindings]]
name = "EVENT_RUNTIME"
class_name = "EventRuntime"

[[env.production.durable_objects.bindings]]
name = "TEAM_RUNTIME"
class_name = "TeamRuntime"

[[env.production.durable_objects.bindings]]
name = "MULTIPLEXER"
class_name = "Multiplexer"

[[env.production.durable_objects.bindings]]
name = "DISCOVERY_STORE"
class_name = "DiscoveryStore"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["EventRuntime", "TeamRuntime", "Multiplexer", "DiscoveryStore"]

[[env.production.workflows]]
name = "daily-event-readiness"
binding = "DAILY_EVENT_READINESS"
class_name = "DailyEventReadinessWorkflow"
concurrency = { limit = 1 }

[[env.production.workflows]]
name = "daily-team-readiness"
binding = "DAILY_TEAM_READINESS"
class_name = "DailyTeamReadinessWorkflow"
concurrency = { limit = 1 }

[[env.production.workflows]]
name = "coverage-audit"
binding = "COVERAGE_AUDIT"
class_name = "CoverageAuditWorkflow"
concurrency = { limit = 1 }

[[env.production.workflows]]
name = "runtime-admin"
binding = "RUNTIME_ADMIN"
class_name = "RuntimeAdminWorkflow"
concurrency = { limit = 3 }
