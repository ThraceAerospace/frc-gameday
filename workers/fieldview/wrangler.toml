# One environment-neutral Runtime Worker for FieldView and future FIRST products.
name = "runtime"
main = "src/index.ts"
compatibility_date = "2026-11-22"

# Production Worker URL: runtime.frc-fieldview.workers.dev
workers_dev = true
preview_urls = true

# Local-only settings belong in workers/fieldview/.dev.vars (see .dev.vars.example).

[assets]
directory = "./admin-assets"
binding = "ASSETS"
run_worker_first = ["/admin", "/admin/*", "/internal/admin/*"]

[triggers]
crons = ["*/5 * * * *", "2 4 * * *", "0 16 * * 1"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[vars]
# Production Access identity values remain managed in the production dashboard.
TBA_AUTHORITATIVE_REFETCH_DELAY_MS = "65000"
STATBOTICS_API_BASE_URL = "https://api-statbotics.iterativerefinement.com/"
STATBOTICS_REFRESH_DELAY_MS = "300000"
EVENT_ACTIVE_INTERVAL_MS = "300000"
EVENT_COMPLETED_RETENTION_MS = "86400000"
TEAM_REFRESH_INTERVAL_MS = "86400000"
TEAM_ACTIVE_REFRESH_INTERVAL_MS = "60000"

# Production D1 database. Discovery and System Records remain separate logical schemas/repositories.
[[d1_databases]]
binding = "DB"
database_name = "fieldview-d1-prod"
database_id = "bd7852b3-7814-4c3f-9ce8-f1c244524843"
migrations_dir = "migrations"

# Production KV namespace for lightweight, non-authoritative projections.
[[kv_namespaces]]
binding = "KV_BINDING"
id = "c067dfcaa3a345b0b43f035a992b4b30"

[[durable_objects.bindings]]
name = "EVENT_RUNTIME"
class_name = "EventRuntime"

[[durable_objects.bindings]]
name = "TEAM_RUNTIME"
class_name = "TeamRuntime"

[[durable_objects.bindings]]
name = "MULTIPLEXER"
class_name = "Multiplexer"

[[durable_objects.bindings]]
name = "REMOTE_SESSION"
class_name = "RemoteSessionRuntime"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EventRuntime", "TeamRuntime", "Multiplexer", "RemoteSessionRuntime"]

[[workflows]]
name = "season-discovery"
binding = "SEASON_DISCOVERY"
class_name = "SeasonDiscoveryWorkflow"
concurrency = { limit = 1 }

[[workflows]]
name = "event-season-readiness"
binding = "EVENT_SEASON_READINESS"
class_name = "EventSeasonReadinessWorkflow"
concurrency = { limit = 1 }

[[workflows]]
name = "team-season-readiness"
binding = "TEAM_SEASON_READINESS"
class_name = "TeamSeasonReadinessWorkflow"
concurrency = { limit = 1 }

[[workflows]]
name = "season-status-resolver"
binding = "SEASON_STATUS_RESOLVER"
class_name = "SeasonStatusResolverWorkflow"
concurrency = { limit = 1 }


[[workflows]]
name = "coverage-audit"
binding = "COVERAGE_AUDIT"
class_name = "CoverageAuditWorkflow"
concurrency = { limit = 1 }

[[workflows]]
name = "weekly-event-projection"
binding = "WEEKLY_EVENT_PROJECTION"
class_name = "WeeklyEventProjectionWorkflow"
concurrency = { limit = 1 }

[[workflows]]
name = "polling-coordinator"
binding = "POLLING_COORDINATOR"
class_name = "PollingCoordinatorWorkflow"
concurrency = { limit = 1 }

# Production-only Workflow binding. Intentionally omitted from [previews.workflows.bindings]:
# Cloudflare Previews cannot provision isolated Workflow instances and must not call production Workflows.
[[workflows]]
name = "event-analytics"
binding = "EVENT_ANALYTICS_WORKFLOW"
class_name = "EventAnalyticsWorkflow"
concurrency = { limit = 8 }

[[workflows]]
name = "runtime-admin"
binding = "RUNTIME_ADMIN"
class_name = "RuntimeAdminWorkflow"
concurrency = { limit = 3 }

# Preview settings are explicit: they do not inherit production variables.
# Durable Object namespaces/storage are provisioned independently for each Preview.
# Preview D1 is isolated from production canonical and operational records.
[[previews.d1_databases]]
binding = "DB"
database_name = "fieldview-d1-test"
database_id = "6862b62b-73a0-43a5-8b2f-5ccd1e8bfc7e"
migrations_dir = "migrations"

# Separate test KV namespace: Preview projections and mutations cannot affect Production.
[[previews.kv_namespaces]]
binding = "KV_BINDING"
id = "19ef5d5221654ab4bac0c8118c35ad8b"

[previews.vars]
# Preview Access app identity; administrator allowlist is a Preview Base secret.
CF_ACCESS_TEAM_DOMAIN = "round-rice-3b7b.cloudflareaccess.com"
CF_ACCESS_AUD = "a30d89715c2a6857ab19db7d65de9b42061d6262c14e3ef3033d09424c6e3572"
TBA_AUTHORITATIVE_REFETCH_DELAY_MS = "65000"
STATBOTICS_API_BASE_URL = "https://api-statbotics.iterativerefinement.com/"
STATBOTICS_REFRESH_DELAY_MS = "300000"
EVENT_ACTIVE_INTERVAL_MS = "300000"
EVENT_COMPLETED_RETENTION_MS = "86400000"
TEAM_REFRESH_INTERVAL_MS = "86400000"
TEAM_ACTIVE_REFRESH_INTERVAL_MS = "60000"

[[previews.durable_objects.bindings]]
name = "EVENT_RUNTIME"
class_name = "EventRuntime"

[[previews.durable_objects.bindings]]
name = "TEAM_RUNTIME"
class_name = "TeamRuntime"

[[previews.durable_objects.bindings]]
name = "MULTIPLEXER"
class_name = "Multiplexer"

[[previews.durable_objects.bindings]]
name = "REMOTE_SESSION"
class_name = "RemoteSessionRuntime"


