# Shared testing runtime Worker.
# Deploy this configuration only from non-main branches.
name = "testing"
main = "src/index.ts"
compatibility_date = "2026-11-17"
workers_dev = true
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[vars]
TBA_AUTHORITATIVE_REFETCH_DELAY_MS = "65000"
STATBOTICS_API_BASE_URL = "https://api-statbotics.iterativerefinement.com/"
STATBOTICS_REFRESH_DELAY_MS = "300000"
EVENT_UPCOMING_INTERVAL_MS = "1800000"
EVENT_ACTIVE_INTERVAL_MS = "300000"
EVENT_COMPLETED_RETENTION_MS = "86400000"
TEAM_REFRESH_INTERVAL_MS = "86400000"
TEAM_ACTIVE_REFRESH_INTERVAL_MS = "60000"

[[r2_buckets]]
binding = "DISCOVERY_BUCKET"
bucket_name = "fieldview-discovery-testing"

[[services]]
binding = "FIELDVIEW_JOBS"
service = "fieldview-jobs-testing"

[[durable_objects.bindings]]
name = "EVENT_RUNTIME"
class_name = "EventRuntime"

[[durable_objects.bindings]]
name = "TEAM_RUNTIME"
class_name = "TeamRuntime"

[[durable_objects.bindings]]
name = "MULTIPLEXER"
class_name = "Multiplexer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EventRuntime"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Multiplexer"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["EventScheduler"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["TeamRuntime"]

[[migrations]]
tag = "v5"
renamed_classes = [{ from = "EventScheduler", to = "TaskScheduler" }]

[[migrations]]
tag = "v6"
deleted_classes = ["TaskScheduler"]
