name = "fieldview-runtime-prototype"
main = "src/index.ts"
compatibility_date = "2026-11-17"
workers_dev = true

# Persist Worker and Durable Object logs; sample traces to limit observability volume.
[observability]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

# Discovery is owned by the isolated fieldview-jobs-prototype Worker.
# Keep this bucket and service binding isolated from production resources.
[[r2_buckets]]
binding = "DISCOVERY_BUCKET"
bucket_name = "fieldview-discovery-prototype"

[[services]]
binding = "FIELDVIEW_JOBS"
service = "fieldview-jobs-prototype"

# This config is deliberately separate from wrangler.toml. It creates an
# isolated Worker and isolated Durable Object namespaces for the prototype.
# Do not add production routes or reuse production Durable Object namespaces.

[vars]
TBA_AUTHORITATIVE_REFETCH_DELAY_MS = "65000"
STATBOTICS_API_BASE_URL = "https://api-statbotics.iterativerefinement.com/"
STATBOTICS_REFRESH_DELAY_MS = "300000"
EVENT_UPCOMING_INTERVAL_MS = "1800000"
EVENT_ACTIVE_INTERVAL_MS = "300000"
EVENT_COMPLETED_RETENTION_MS = "86400000"
TEAM_REFRESH_INTERVAL_MS = "86400000"
TEAM_ACTIVE_REFRESH_INTERVAL_MS = "60000"
PROVIDER_REQUEST_INTERVAL_MS = "1000"

[[durable_objects.bindings]]
name = "EVENT_RUNTIME"
class_name = "EventRuntime"

[[durable_objects.bindings]]
name = "TEAM_RUNTIME"
class_name = "TeamRuntime"

[[durable_objects.bindings]]
name = "MULTIPLEXER"
class_name = "Multiplexer"

[[migrations]]
tag = "prototype-v1"
new_sqlite_classes = ["EventRuntime"]

[[migrations]]
tag = "prototype-v2"
new_sqlite_classes = ["Multiplexer"]

[[migrations]]
tag = "prototype-v3"
new_sqlite_classes = ["EventScheduler"]

[[migrations]]
tag = "prototype-v4"
new_sqlite_classes = ["TeamRuntime"]

[[migrations]]
tag = "prototype-v5"
renamed_classes = [{ from = "EventScheduler", to = "TaskScheduler" }]

