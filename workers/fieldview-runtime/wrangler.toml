# Production runtime Worker.
# Deploy this configuration only from the main branch.
name = "runtime"
main = "src/index.ts"
compatibility_date = "2026-11-17"
workers_dev = true
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[vars]

[[r2_buckets]]
binding = "DISCOVERY_BUCKET"
bucket_name = "fieldview-discovery"

[[services]]
binding = "FIELDVIEW_JOBS"
service = "fieldview-jobs"

[[durable_objects.bindings]]
name = "EVENT_RUNTIME"
class_name = "EventRuntime"

[[durable_objects.bindings]]
name = "MULTIPLEXER"
class_name = "Multiplexer"

[[durable_objects.bindings]]
name = "TEAM_RUNTIME"
class_name = "TeamRuntime"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EventRuntime"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Multiplexer"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["EventScheduler"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["TeamRuntime"]

[[migrations]]
tag = "v5"
renamed_classes = [{ from = "EventScheduler", to = "TaskScheduler" }]

# Retire the former global coordinator after its responsibilities moved to
# entity runtimes and Jobs Worker Workflows.
[[migrations]]
tag = "v6"
deleted_classes = ["TaskScheduler"]
