name = "fieldview-runtime"
main = "src/index.ts"
compatibility_date = "2026-11-17"
workers_dev = false

[vars]
PROVIDER_REQUEST_INTERVAL_MS = "1000"

[[durable_objects.bindings]]
name = "EVENT_RUNTIME"
class_name = "EventRuntime"

[[durable_objects.bindings]]
name = "MULTIPLEXER"
class_name = "Multiplexer"

[[durable_objects.bindings]]
name = "EVENT_SCHEDULER"
class_name = "EventScheduler"

[[durable_objects.bindings]]
name = "TEAM_RUNTIME"
class_name = "TeamRuntime"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EventRuntime"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Multiplexer"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["EventScheduler"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["TeamRuntime"]

[triggers]
crons = ["0 16 * * *"]
